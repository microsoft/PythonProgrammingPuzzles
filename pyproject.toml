[tool.poetry]
name = "p3"
version = "0.1.0"
description = "Programming Puzzles and Code Competitions"
authors = ["P3 Contributors"]
readme = "README.md"
packages = [{include = "generators"}, {include = "solvers"}]

[tool.poetry.dependencies]
python = "^3.8"
# Core dependencies from ICLR2023/src/requirements.txt
tqdm = "*"
# orderedset = "*"  # Has build issues, using built-in OrderedDict instead
numpy = "*"
astor = "*"
scikit-learn = "*"
fire = "*"
strictfire = "*"
pebble = "*"
# Other common dependencies found in the project
datasets = "*"
transformers = "^4.30.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.1"

[tool.poetry.scripts]
test = "pytest:main"
tests = "pytest:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=generators",
    "--cov=solvers",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    # "--cov-fail-under=80",  # Disabled for infrastructure testing
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "slow: Slow tests that should be run less frequently",
]

[tool.coverage.run]
source = ["generators", "solvers"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
# fail_under = 80  # Disabled for infrastructure testing
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"